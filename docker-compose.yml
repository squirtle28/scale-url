services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scaleurl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scaleurl}
      POSTGRES_DB: ${POSTGRES_DB:-scaleurl}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed only so a developer can connect a local SQL client;
      # the backend containers reach Postgres over the Docker network
      # regardless of whether this is published.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scaleurl}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - scaleurl-net

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scaleurl}:${POSTGRES_PASSWORD:-scaleurl}@postgres:5432/${POSTGRES_DB:-scaleurl}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scaleurl-net

  backend1:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scaleurl}:${POSTGRES_PASSWORD:-scaleurl}@postgres:5432/${POSTGRES_DB:-scaleurl}
      BASE_URL: ${BASE_URL:-http://localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - scaleurl-net

  backend2:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scaleurl}:${POSTGRES_PASSWORD:-scaleurl}@postgres:5432/${POSTGRES_DB:-scaleurl}
      BASE_URL: ${BASE_URL:-http://localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - scaleurl-net

  backend3:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-scaleurl}:${POSTGRES_PASSWORD:-scaleurl}@postgres:5432/${POSTGRES_DB:-scaleurl}
      BASE_URL: ${BASE_URL:-http://localhost}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - scaleurl-net

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend1
      - backend2
      - backend3
    networks:
      - scaleurl-net

networks:
  scaleurl-net:
    driver: bridge

volumes:
  pgdata:

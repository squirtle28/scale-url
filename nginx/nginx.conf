worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Round-robin (the default `upstream` load-balancing algorithm) across
    # the three stateless FastAPI instances. Any of them can serve any
    # request since none of them hold in-memory state.
    upstream backend {
        server backend1:8000;
        server backend2:8000;
        server backend3:8000;
    }

    # Rate-limit zones, keyed by client IP ($binary_remote_addr).
    # URL creation is limited more tightly than redirects, since
    # redirects are the expected high-volume "hot path" of a URL
    # shortener while creation is comparatively rare and cheaper to
    # abuse (e.g. spamming new short links).
    limit_req_zone $binary_remote_addr zone=creation_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=redirect_limit:10m rate=20r/s;

    log_format main '$remote_addr - [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_referer" '
                     'upstream=$upstream_addr rt=$request_time';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    server {
        listen 80;

        # Basic upstream failure handling: if a backend fails to connect
        # or times out, NGINX automatically retries the next upstream
        # server before giving up (Docker's healthy backends absorb the
        # failure of one instance transparently).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_connect_timeout 3s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # URL creation endpoint: stricter limit, small burst allowance.
        location /api/v1/urls {
            limit_req zone=creation_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
        }

        # Health check: never rate-limited, so Docker/monitoring can poll
        # it freely.
        location /health {
            proxy_pass http://backend;
        }

        # Everything else, including the bare "/{short_code}" redirect
        # path, gets the more generous redirect rate limit.
        location / {
            limit_req zone=redirect_limit burst=40 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
        }
    }
}
